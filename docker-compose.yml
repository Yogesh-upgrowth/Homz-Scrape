name: homz

# The datastore is MongoDB Atlas — there is no database service here. Set
# HOMZ_MONGODB_URI in .env to your cluster's connection string.
#
# For offline work, `docker compose --profile local up -d mongo` starts a local
# replica-set node. Note that Atlas Search is unavailable there, so the API
# falls back to $text: weighted but with no fuzzy/typo tolerance. Develop
# against a free Atlas M0 cluster if search behaviour matters.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  env_file: [.env]
  environment:
    HOMZ_LOG_JSON: "true"
  volumes:
    - ./data:/app/data          # raw HTML archive survives container rebuilds
  restart: unless-stopped

services:
  api:
    <<: *app
    command: uvicorn homz.search.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    command: python -m homz.scheduler.jobs
    # Browser jobs need more shared memory than Docker's 64MB default.
    shm_size: 1gb

  # One-off CLI runs:
  #   docker compose run --rm scraper-cli db init
  #   docker compose run --rm scraper-cli scrape source magicbricks --max-items 20 --dry-run
  scraper-cli:
    <<: *app
    entrypoint: ["homz"]
    command: ["--help"]
    profiles: ["cli"]
    restart: "no"
    shm_size: 1gb

  # Optional offline datastore. Single-node replica set so change streams and
  # transactions work; Atlas Search still does not exist here.
  mongo:
    image: mongo:7
    profiles: ["local"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mongodata:
